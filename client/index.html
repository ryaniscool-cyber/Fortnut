<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnut</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0c1016;
        font-family: "Segoe UI", sans-serif;
        color: #fff;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .bar {
        height: 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
        margin-bottom: 6px;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #00d4ff, #0077ff);
      }
      .bar.health > span {
        background: linear-gradient(90deg, #ff3f3f, #ff8a3d);
      }
      .panel {
        position: absolute;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #status {
        bottom: 20px;
        left: 20px;
        width: 240px;
      }
      #inventory {
        bottom: 20px;
        right: 20px;
        display: grid;
        gap: 6px;
      }
      #inventory .slot {
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
      }
      #inventory .slot.active {
        outline: 2px solid #4cf3ff;
      }
      #compass {
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 4px;
        text-align: center;
      }
      #minimap {
        top: 20px;
        right: 20px;
        width: 160px;
        height: 160px;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        margin-top: -9px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 50%;
      }
      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        padding: 10px 18px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <div id="compass" class="panel">N • NE • E • SE • S • SW • W • NW</div>
      <div id="minimap" class="panel">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
      </div>
      <div id="status" class="panel">
        <div>Health</div>
        <div class="bar health"><span id="health-bar"></span></div>
        <div>Shield</div>
        <div class="bar"><span id="shield-bar"></span></div>
        <div id="resources"></div>
      </div>
      <div id="inventory" class="panel"></div>
      <div id="crosshair"></div>
      <div id="message">Click to play</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
